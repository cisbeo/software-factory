name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x install.sh tests/*.sh tests/fake-bin/gh
      - name: Tests de install.sh
        run: bash tests/run.sh
      - name: config.json valide
        run: python3 -m json.tool factory/config.json > /dev/null
      - name: Scripts Python compilent
        run: python3 -m py_compile factory/bin/job factory/bin/gate factory/bin/route
